name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Remove obsolete source files
        shell: bash
        run: |
          bash ./Tools/clean-obsolete-files.sh
          test ! -e RoomSurveyElectrical/SmartProjectEmbedding.swift

      - name: Verify DXF, dynamic widget, and PDF source
        shell: bash
        run: |
          grep -q 'MODEL_SPACE_UTF8_2007' RoomSurveyElectrical/DXFExporter.swift
          grep -q 'CODE_SIGN_ENTITLEMENTS = Support/RoomSurveyElectrical.entitlements' RoomSurveyElectrical.xcodeproj/project.pbxproj
          grep -q 'CODE_SIGN_ENTITLEMENTS = Support/3ERoomElectricalWidget.entitlements' RoomSurveyElectrical.xcodeproj/project.pbxproj
          grep -q '3ERoomElectricalRecentProjects' 3ERoomElectricalWidget/3ERoomElectricalWidget.swift
          grep -q 'PDFViewerScreen' RoomSurveyElectrical/ExternalDocumentOpenView.swift
          grep -q 'pauseForApplicationLifecycle' RoomSurveyElectrical/RoomCaptureModel.swift
          grep -q 'scanContinuationState' RoomSurveyElectrical/Models.swift
          grep -q 'إيقاف مؤقت وحفظ' RoomSurveyElectrical/ContentView.swift
          plutil -lint Support/RoomSurveyElectrical.entitlements
          plutil -lint Support/3ERoomElectricalWidget.entitlements

      - name: Build for a physical iPhone
        id: xcodebuild
        shell: bash
        run: |
          mkdir -p build
          set +e
          xcodebuild \
            -project RoomSurveyElectrical.xcodeproj \
            -scheme RoomSurveyElectrical \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/RoomSurveyElectrical.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build > build.log 2>&1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "===== Xcode error summary ====="
          grep -nEi 'error:|fatal error|failed|failure' build.log | tail -n 120 || true
          echo "===== Last 250 build-log lines ====="
          tail -n 250 build.log
          exit 0

      - name: Verify embedded widget extension
        if: steps.xcodebuild.outputs.status == '0'
        shell: bash
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/3ERoomElectrical.app"
          WIDGET_PATH="$APP_PATH/PlugIns/3ERoomElectricalWidgetExtension.appex"
          test -d "$APP_PATH"
          test -d "$WIDGET_PATH"
          test -f "$WIDGET_PATH/Info.plist"
          MAIN_ID=$(plutil -extract CFBundleIdentifier raw "$APP_PATH/Info.plist")
          WIDGET_ID=$(plutil -extract CFBundleIdentifier raw "$WIDGET_PATH/Info.plist")
          EXTENSION_POINT=$(plutil -extract NSExtension.NSExtensionPointIdentifier raw "$WIDGET_PATH/Info.plist")
          test "$WIDGET_ID" = "$MAIN_ID.widget"
          test "$EXTENSION_POINT" = "com.apple.widgetkit-extension"
          {
            echo "Main bundle: $MAIN_ID"
            echo "Widget bundle: $WIDGET_ID"
            echo "Extension point: $EXTENSION_POINT"
            echo "Widget path: $WIDGET_PATH"
          } | tee build/widget-bundle-report.txt

      - name: Package unsigned IPA
        if: steps.xcodebuild.outputs.status == '0'
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/3ERoomElectrical.app"
          test -d "$APP_PATH/PlugIns/3ERoomElectricalWidgetExtension.appex"
          rm -rf build/Payload
          mkdir -p build/Payload
          ditto "$APP_PATH" build/Payload/3ERoomElectrical.app
          cd build
          zip -qry 3ERoomElectrical-unsigned.ipa Payload
          unzip -l 3ERoomElectrical-unsigned.ipa | grep -q 'Payload/3ERoomElectrical.app/PlugIns/3ERoomElectricalWidgetExtension.appex/'

      - name: Upload IPA and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3ERoomElectrical-unsigned
          path: |
            build/3ERoomElectrical-unsigned.ipa
            build.log
            build/RoomSurveyElectrical.xcresult
            build/widget-bundle-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Mark build as failed
        if: steps.xcodebuild.outputs.status != '0'
        shell: bash
        run: |
          echo "===== Xcode failure lines ====="
          grep -nEi 'error:|fatal error|failed|failure|multiple commands produce|build input file cannot be found' build.log | tail -n 80 || true
          {
            echo "### Xcode build failed"
            echo
            echo '```'
            grep -nEi 'error:|fatal error|failed|failure|multiple commands produce|build input file cannot be found' build.log | tail -n 80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Xcode build failed. Download the 3ERoomElectrical-unsigned artifact for the complete build.log and xcresult."
          exit "${{ steps.xcodebuild.outputs.status }}"
